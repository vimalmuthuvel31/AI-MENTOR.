<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGenius - AI Coding Mentor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #0b0b0b;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #ffffff;
            border-right: 0.5px solid #e0e0e0;
            overflow-y: auto;
            padding: 20px 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.05);
        }

        .sidebar-header {
            margin-bottom: 24px;
            padding: 0 20px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #0b0b0b;
            margin-bottom: 4px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: #666;
        }

        .sidebar-item {
            padding: 12px 20px;
            cursor: pointer;
            color: #666;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .sidebar-item:hover {
            background: #f9f9f9;
            color: #333;
        }

        .sidebar-item.active {
            color: #0b0b0b;
            border-left-color: #2a78d6;
            background: #f0f4f9;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            border-bottom: 0.5px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 500;
            color: #0b0b0b;
        }

        .header-user {
            font-size: 13px;
            color: #666;
        }

        .header-user strong {
            color: #0b0b0b;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: #ffffff;
            border: 0.5px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-card {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 600;
            color: #0b0b0b;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .code-block {
            background: #f5f5f5;
            border: 0.5px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #0b0b0b;
            overflow-x: auto;
        }

        .button {
            padding: 8px 16px;
            background: #2a78d6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .button:hover {
            background: #1a5fb8;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(42, 120, 214, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: transparent;
            border: 0.5px solid #e0e0e0;
            color: #0b0b0b;
        }

        .button-secondary:hover {
            background: #f9f9f9;
            border-color: #ccc;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin: 24px 0 16px;
            color: #0b0b0b;
        }

        h3 {
            font-size: 16px;
            font-weight: 500;
            margin: 16px 0 12px;
            color: #0b0b0b;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 0.5px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 120px;
            background: #ffffff;
            color: #0b0b0b;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: #2a78d6;
            box-shadow: 0 0 0 3px rgba(42, 120, 214, 0.1);
        }

        input[type="text"],
        select {
            padding: 8px 12px;
            border: 0.5px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            background: #ffffff;
            color: #0b0b0b;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #2a78d6;
            box-shadow: 0 0 0 3px rgba(42, 120, 214, 0.1);
        }

        .output-box {
            background: #f5f5f5;
            border: 0.5px solid #e0e0e0;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .challenge-item {
            background: #f9f9f9;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            border: 0.5px solid #e0e0e0;
        }

        .xp-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .feature-badge {
            display: inline-block;
            background: #d1ecf1;
            color: #0c5460;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin: 4px 4px 4px 0;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 4px;
            height: 8px;
            margin: 12px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: #2a78d6;
            height: 100%;
            transition: width 0.3s ease;
        }

        .tab-list {
            display: flex;
            gap: 16px;
            border-bottom: 0.5px solid #e0e0e0;
            margin-bottom: 16px;
        }

        .tab {
            padding: 12px 0;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 14px;
            font-weight: 500;
        }

        .tab.active {
            color: #0b0b0b;
            border-bottom-color: #2a78d6;
        }

        .text-secondary {
            color: #666;
        }

        .text-muted {
            color: #999;
        }

        .text-danger {
            color: #e34948;
        }

        .text-success {
            color: #0ca30c;
        }

        .mentor-response {
            background: #f0f4f9;
            border-left: 3px solid #2a78d6;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.6;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .achievement-card {
            text-align: center;
            padding: 16px;
        }

        .achievement-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .achievement-title {
            font-weight: 500;
            color: #0b0b0b;
            font-size: 13px;
        }

        .achievement-progress {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        .locked {
            opacity: 0.4;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">CodeGenius</div>
                <div class="sidebar-subtitle">AI Learning Hub</div>
            </div>
            <div id="sidebar-items"></div>
            <div style="border-top: 0.5px solid #e0e0e0; margin-top: 24px; padding-top: 24px; color: #666; font-size: 12px; padding-left: 20px; padding-right: 20px;">
                <div style="margin-bottom: 8px;">🎓 Student Dashboard</div>
                <div>Enhance your coding journey</div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 id="section-title">Dashboard</h1>
                <div class="header-user">Welcome, <strong>Alex</strong></div>
            </div>
            <div class="content-area" id="content"></div>
        </div>
    </div>

    <script>
        const sections = {
            dashboard: { label: '📊 Dashboard' },
            mentor: { label: '✦ AI Mentor' },
            playground: { label: '⌘ Code Playground' },
            snippets: { label: '📚 Code Snippets' },
            algorithms: { label: '🔄 Algorithm Viz' },
            interview: { label: '🎯 Interview Prep' },
            portfolio: { label: '🎨 Portfolio' },
            progress: { label: '◔ Progress' },
            achievements: { label: '♛ Achievements' }
        };

        let currentSection = 'dashboard';

        // Initialize sidebar
        const navItems = document.getElementById('sidebar-items');
        Object.entries(sections).forEach(([key, { label }]) => {
            const item = document.createElement('div');
            item.className = 'sidebar-item' + (key === 'dashboard' ? ' active' : '');
            item.textContent = label;
            item.onclick = () => navigateTo(key);
            navItems.appendChild(item);
        });

        function navigateTo(section) {
            currentSection = section;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('section-title').textContent = sections[section].label;
            renderContent(section);
        }

        function renderContent(section) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            if (section === 'dashboard') {
                content.innerHTML = `
                    <div class="grid">
                        <div class="card stat-card">
                            <div class="stat-number">7</div>
                            <div class="stat-label">Day Streak 🔥</div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-number">2450</div>
                            <div class="stat-label">XP Earned ⭐</div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-number">86</div>
                            <div class="stat-label">Problems Solved ✓</div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-number">24</div>
                            <div class="stat-label">Concepts Mastered 🎓</div>
                        </div>
                    </div>

                    <h2>Continue Learning</h2>
                    <div class="card" style="margin-bottom: 24px;">
                        <div style="margin-bottom: 12px;">
                            <div style="font-weight: 500; color: #0b0b0b;">JavaScript — Intermediate</div>
                            <div class="text-secondary" style="font-size: 12px;">Module: Async JavaScript</div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 68%;"></div>
                        </div>
                        <div style="text-align: right; font-size: 12px; color: #666; margin-bottom: 12px;">68%</div>
                        <button class="button">▶ Resume Lesson</button>
                    </div>

                    <h2>AI Performance Insight</h2>
                    <div class="card">
                        <div style="color: #0b0b0b; line-height: 1.6;">
                            Your debugging accuracy improved by <span style="color: #2a78d6; font-weight: 600;">18%</span> this week. Great job isolating scope issues!
                            <br><br>
                            <strong>Recommended Next:</strong> Focus on async/await patterns and Promise chains.
                        </div>
                    </div>
                `;
            } else if (section === 'mentor') {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 24px;">
                        <div style="margin-bottom: 16px;">
                            <div style="background: #f0f4f9; border-radius: 6px; padding: 16px; border-left: 3px solid #2a78d6;">
                                <div style="color: #0b0b0b; font-weight: 500; margin-bottom: 12px;">Hi Alex! 👋</div>
                                <div class="text-secondary" style="font-size: 14px; line-height: 1.6;">
                                    I'm here to help you understand problems, not just give answers. What would you like to learn today?
                                </div>
                            </div>
                        </div>

                        <div style="margin-bottom: 16px;">
                            <label style="display: block; font-size: 12px; font-weight: 500; margin-bottom: 8px; color: #0b0b0b;">Ask me about:</label>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                <button class="button button-secondary" onclick="askMentor('Explain Promises')">Explain Promises</button>
                                <button class="button button-secondary" onclick="askMentor('Recursion')">Recursion</button>
                                <button class="button button-secondary" onclick="askMentor('Debug Challenge')">Debug Challenge</button>
                                <button class="button button-secondary" onclick="askMentor('Algorithms')">Algorithms</button>
                            </div>
                        </div>

                        <textarea id="mentor-question" placeholder="Type your question here..."></textarea>
                        <button class="button" onclick="sendMentorQuestion()" style="margin-top: 12px; width: 100%;">Get Guided Hint →</button>

                        <div id="mentor-response"></div>
                    </div>

                    <h2>Learning Tools</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="card">
                            <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">🔮 Code Prediction</div>
                            <div class="text-secondary" style="font-size: 13px;">Predict code output before running it</div>
                        </div>
                        <div class="card">
                            <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">🎯 Adaptive Practice</div>
                            <div class="text-secondary" style="font-size: 13px;">Practice based on your mistakes</div>
                        </div>
                    </div>
                `;
            } else if (section === 'playground') {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 24px;">
                        <div style="margin-bottom: 16px;">
                            <label style="display: block; font-weight: 500; margin-bottom: 8px; color: #0b0b0b;">JavaScript Code:</label>
                            <textarea id="code-input">const numbers = [1, 2, 3, 4, 5];
const doubled = numbers.map(n => n * 2);
console.log(doubled);</textarea>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <button class="button" onclick="runCode()">▶ Run Code</button>
                            <button class="button button-secondary" onclick="analyzeCode()">🔍 Analyze Quality</button>
                        </div>

                        <div id="code-output" class="output-box" style="display: none;"></div>
                    </div>
                `;
            } else if (section === 'snippets') {
                content.innerHTML = `
                    <div style="margin-bottom: 24px;">
                        <input type="text" id="snippet-search" placeholder="Search snippets..." style="margin-bottom: 16px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="card">
                                <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">✓ Array Methods</div>
                                <div class="code-block" style="font-size: 11px;">map, filter, reduce, find, forEach</div>
                                <button class="button button-secondary" style="width: 100%; margin-top: 8px;">View Examples</button>
                            </div>
                            <div class="card">
                                <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">⚡ Async/Await</div>
                                <div class="code-block" style="font-size: 11px;">async function, await, Promise handling</div>
                                <button class="button button-secondary" style="width: 100%; margin-top: 8px;">View Examples</button>
                            </div>
                            <div class="card">
                                <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">🔗 Fetch API</div>
                                <div class="code-block" style="font-size: 11px;">GET, POST, error handling</div>
                                <button class="button button-secondary" style="width: 100%; margin-top: 8px;">View Examples</button>
                            </div>
                            <div class="card">
                                <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">🎯 Closures</div>
                                <div class="code-block" style="font-size: 11px;">Function scope, memory, privacy</div>
                                <button class="button button-secondary" style="width: 100%; margin-top: 8px;">View Examples</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (section === 'algorithms') {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 24px;">
                        <label style="display: block; font-weight: 500; margin-bottom: 12px; color: #0b0b0b;">Algorithm Visualizer</label>
                        <select id="algo-select" style="margin-bottom: 12px;" onchange="visualizeAlgorithm()">
                            <option value="">Select an algorithm...</option>
                            <option value="bubble">Bubble Sort</option>
                            <option value="merge">Merge Sort</option>
                            <option value="binary">Binary Search</option>
                            <option value="dfs">Depth-First Search</option>
                            <option value="bfs">Breadth-First Search</option>
                        </select>

                        <div id="algo-visual" style="background: #f9f9f9; border-radius: 6px; padding: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; border: 0.5px solid #e0e0e0;">
                            <div class="text-secondary" style="text-align: center;">Select an algorithm to visualize</div>
                        </div>

                        <div style="margin-top: 16px;">
                            <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">Time Complexity Analysis:</div>
                            <div id="complexity-info" style="background: #f9f9f9; padding: 12px; border-radius: 6px; font-size: 13px; color: #666; border: 0.5px solid #e0e0e0; font-family: 'Courier New', monospace; white-space: pre;"></div>
                        </div>
                    </div>
                `;
            } else if (section === 'interview') {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 24px;">
                        <div style="margin-bottom: 16px;">
                            <label style="display: block; font-weight: 500; margin-bottom: 12px; color: #0b0b0b;">Daily Interview Question</label>
                            <div class="challenge-item">
                                <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">Two Sum Problem</div>
                                <div class="text-secondary" style="font-size: 13px; margin-bottom: 12px;">
                                    Given an array of integers, find two numbers that add up to a specific target. Return their indices.
                                </div>
                                <div class="xp-badge">+150 XP</div>
                                <div style="margin-top: 12px; padding: 12px; background: #f5f5f5; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 11px;">
                                    Example: nums = [2,7,11,15], target = 9<br>
                                    Output: [0, 1]
                                </div>
                            </div>
                        </div>

                        <textarea placeholder="Write your solution here..."></textarea>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;">
                            <button class="button">Submit Solution</button>
                            <button class="button button-secondary">Get Hint</button>
                        </div>

                        <div style="margin-top: 24px;">
                            <h3>Interview Tips</h3>
                            <div style="background: #f9f9f9; padding: 12px; border-radius: 6px; font-size: 13px; color: #666; line-height: 1.8; border: 0.5px solid #e0e0e0;">
                                ✓ Clarify the problem and edge cases<br>
                                ✓ Think of multiple approaches<br>
                                ✓ Optimize time and space complexity<br>
                                ✓ Write clean, readable code<br>
                                ✓ Test with examples
                            </div>
                        </div>
                    </div>
                `;
            } else if (section === 'portfolio') {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 24px;">
                        <div style="margin-bottom: 16px;">
                            <label style="display: block; font-weight: 500; margin-bottom: 12px; color: #0b0b0b;">Your Projects</label>
                            <button class="button" style="margin-bottom: 16px;">+ Add New Project</button>
                            
                            <div class="challenge-item">
                                <div style="font-weight: 500; color: #0b0b0b;">Weather App</div>
                                <div class="text-secondary" style="font-size: 12px; margin: 4px 0;">JavaScript, React, API</div>
                                <div style="margin-top: 8px;">
                                    <span class="feature-badge">Real-time Data</span>
                                    <span class="feature-badge">Responsive</span>
                                </div>
                                <div class="text-secondary" style="margin-top: 8px; font-size: 13px;">
                                    A weather application with real-time forecasts and interactive maps.
                                </div>
                            </div>

                            <div class="challenge-item">
                                <div style="font-weight: 500; color: #0b0b0b;">Todo List Manager</div>
                                <div class="text-secondary" style="font-size: 12px; margin: 4px 0;">React, Redux, LocalStorage</div>
                                <div style="margin-top: 8px;">
                                    <span class="feature-badge">State Management</span>
                                    <span class="feature-badge">CRUD Operations</span>
                                </div>
                                <div class="text-secondary" style="margin-top: 8px; font-size: 13px;">
                                    Full-featured todo application with task management and persistence.
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (section === 'progress') {
                content.innerHTML = `
                    <div class="card" style="margin-bottom: 24px;">
                        <h2>Your Learning Progress</h2>
                        
                        <div style="margin-bottom: 24px;">
                            <div style="font-weight: 500; color: #0b0b0b; margin-bottom: 8px;">Total XP: 2450 → 550 XP to Level 43</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 82%;"></div>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div style="padding: 12px; background: #f9f9f9; border-radius: 6px; border: 0.5px solid #e0e0e0;">
                                <div class="text-secondary" style="font-size: 12px;">Problems</div>
                                <div style="font-size: 20px; font-weight: 600; color: #0b0b0b;">86 <span class="text-success" style="font-size: 12px;">+12 this week</span></div>
                            </div>
                            <div style="padding: 12px; background: #f9f9f9; border-radius: 6px; border: 0.5px solid #e0e0e0;">
                                <div class="text-secondary" style="font-size: 12px;">Mastery</div>

        function runCode() {
            const code = document.getElementById('code-input').value;
            const output = document.getElementById('code-output');
            
            try {
                let logs = [];
                const originalLog = console.log;
                console.log = (...args) => logs.push(args.join(' '));
                
                eval(code);
                
                console.log = originalLog;
                output.textContent = logs.length > 0 ? logs.join('\n') : '(no output)';
                output.style.display = 'block';
            } catch (err) {
                output.textContent = '❌ Error: ' + err.message;
                output.style.display = 'block';
            }
        }

        function analyzeCode() {
            const code = document.getElementById('code-input').value;
            const output = document.getElementById('code-output');
            
            let analysis = '📊 Code Quality Analysis:\n\n';
            analysis += '✓ No syntax errors\n';
            analysis += '✓ Proper variable naming\n';
            if (code.length < 200) analysis += '✓ Concise code\n';
            if (code.includes('const') || code.includes('let')) analysis += '✓ Uses const/let\n';
            analysis += '\n💡 Suggestions:\n• Add comments for clarity\n• Consider edge cases';
            
            output.textContent = analysis;
            output.style.display = 'block';
        }

        function askMentor(topic) {
            document.getElementById('mentor-question').value = topic;
            sendMentorQuestion();
        }

        function sendMentorQuestion() {
            const question = document.getElementById('mentor-question').value;
            const response = document.getElementById('mentor-response');
            
            if (!question.trim()) {
                response.innerHTML = '<div class="text-danger" style="font-size: 12px; margin-top: 12px;">Please enter a question first</div>';
                return;
            }

            response.innerHTML = `<div class="mentor-response">
                💡 <strong>Guided Hint:</strong> Think about how ${question.toLowerCase()} works fundamentally. What are the key concepts involved?<br><br>
                Instead of giving you the answer, I'm asking you to think deeper. Try solving this yourself, and come back if you need more help!
            </div>`;
        }

        function visualizeAlgorithm() {
            const algo = document.getElementById('algo-select').value;
            const visual = document.getElementById('algo-visual');
            const complexity = document.getElementById('complexity-info');
            
            const algorithms = {
                bubble: {
                    visual: '📊 Comparing adjacent elements\n\n[5] [3] [8] [2] [1]\n [3] [5] [8] [2] [1]\n [3] [5] [2] [8] [1]\n [3] [5] [2] [1] [8]',
                    complexity: 'Time: O(n²)\nSpace: O(1)\n\nWorst case: Reverse sorted array\nBest case: Already sorted array'
                },
                merge: {
                    visual: '📊 Divide and Conquer\n\n[5,3,8,2] → [5,3] [8,2]\n  ↓         ↓      ↓\n [3,5]    [2,8]\n    ↓        ↓\n [2,3,5,8]',
                    complexity: 'Time: O(n log n)\nSpace: O(n)\n\nStable sorting algorithm\nGood for large datasets'
                },
                binary: {
                    visual: '📊 Binary Search\n\nTarget: 7 in [1,3,5,7,9,11]\n  Left: 1, Right: 11\n  Mid: 5 → 5 < 7, move left\n  Found: 7 ✓',
                    complexity: 'Time: O(log n)\nSpace: O(1)\n\nRequires sorted array\nVery efficient for large data'
                },
                dfs: {
                    visual: '📊 Depth-First Search\n\n    1\n   / \\\n  2   3\n /    /\n4    5\n\nOrder: 1→2→4→3→5',
                    complexity: 'Time: O(V + E)\nSpace: O(V)\n\nUses stack (recursion)\nGood for exploring deep'
                },
                bfs: {
                    visual: '📊 Breadth-First Search\n\n    1\n   / \\\n  2   3\n /    /\n4    5\n\nOrder: 1→2→3→4→5',
                    complexity: 'Time: O(V + E)\nSpace: O(V)\n\nUses queue\nGood for shortest path'
                }
            };

            if (algorithms[algo]) {
                visual.innerHTML = '<div style="font-family: \'Courier New\', monospace; font-size: 12px; white-space: pre; color: #0b0b0b; line-height: 1.6;">' + algorithms[algo].visual + '</div>';
                complexity.textContent = algorithms[algo].complexity;
            }
        }

        // Initial render
        renderContent('dashboard');
    </script>
